[package]
name = "rusteron-consensus-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nremond/rusteron"
readme = "README.md"
description = "Aeron Cluster's consensus module as a sans-IO state machine, wire- and on-disk-compatible with Aeron 1.54.2: no clock, no randomness, no I/O."
keywords = ["aeron", "aeron-cluster", "consensus", "raft", "sans-io"]
categories = ["network-programming"]

[features]
# Fakes of the module's surroundings (archive, services, clients, members), for tests.
testkit = ["rusteron-archive/testkit"]

[dependencies]
rusteron-archive = { path = "../rusteron-archive", version = "0.3.2" }
rusteron-cluster-codecs = { path = "../rusteron-cluster-codecs", version = "0.1.0" }
rusteron-cluster-core = { path = "../rusteron-cluster-core", version = "0.1.0" }

[dev-dependencies]
rusteron-consensus-core = { path = ".", features = ["testkit"] }
