[package]
name = "rusteron-cluster-standby"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nremond/rusteron"
readme = "README.md"
description = "A warm standby for Aeron Cluster, wire-compatible with Aeron 1.54.2: a cluster backup that also runs the service on the log it records, takes standby snapshots and offers them to the members, and seeds a new cluster after a disaster."
keywords = ["aeron", "aeron-cluster", "standby", "disaster-recovery"]
categories = ["network-programming"]

[features]
default = []
# Links Aeron C statically, as rusteron-archive's own feature.
static = ["rusteron-cluster/static", "rusteron-cluster-tools/static"]

[dependencies]
ctrlc = { workspace = true, features = ["termination"] }
rusteron-archive = { path = "../rusteron-archive", version = "0.3.2" }
rusteron-archive-core = { path = "../rusteron-archive-core", version = "0.1.0" }
rusteron-cluster = { path = "../rusteron-cluster", version = "0.1.0" }
rusteron-cluster-codecs = { path = "../rusteron-cluster-codecs", version = "0.1.0" }
rusteron-cluster-core = { path = "../rusteron-cluster-core", version = "0.1.0" }
rusteron-cluster-tools = { path = "../rusteron-cluster-tools", version = "0.1.0" }
rusteron-consensus-core = { path = "../rusteron-consensus-core", version = "0.1.0" }
