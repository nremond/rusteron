[package]
name = "rusteron-cluster-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nremond/rusteron"
readme = "README.md"
description = "Tools to run and check an Aeron Cluster of separate processes: a node's C media driver process, a log comparison across members' archives, a status probe, and scripts that run a cluster on one host."
keywords = ["aeron", "aeron-cluster", "testing", "operations"]
categories = ["network-programming", "development-tools::testing"]

[features]
default = []
# Links Aeron C statically, as rusteron-archive's own feature.
static = ["rusteron-archive/static", "rusteron-media-driver/static", "rusteron-cluster/static"]

[dependencies]
crc32c = "0.6"
ctrlc = { workspace = true, features = ["termination"] }
log = { workspace = true }
rusteron-archive = { path = "../rusteron-archive", version = "0.3.2" }
rusteron-cluster = { path = "../rusteron-cluster", version = "0.1.0" }
rusteron-cluster-core = { path = "../rusteron-cluster-core", version = "0.1.0" }
rusteron-media-driver = { path = "../rusteron-media-driver", version = "0.3.2" }
