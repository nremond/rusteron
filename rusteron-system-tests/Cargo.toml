[package]
name = "rusteron-system-tests"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "System tests of rusteron's Aeron Archive and Aeron Cluster, as Aeron's aeron-system-tests: against Java Aeron 1.54.2 on the same log, under Jepsen, and in a deterministic simulator."

[features]
static = ["rusteron-cluster/static", "rusteron-archive/static"]

[dependencies]
hdrhistogram = { workspace = true }
rusteron-archive = { path = "../rusteron-archive" }
rusteron-cluster = { path = "../rusteron-cluster" }

[[bin]]
name = "rust_service_node"
path = "src/bin/rust_service_node.rs"

[[bin]]
name = "rust_bench_node"
path = "src/bin/rust_bench_node.rs"

[[bin]]
name = "echo_client"
path = "src/bin/echo_client.rs"

[[bin]]
name = "bench_client"
path = "src/bin/bench_client.rs"

[[bin]]
name = "client_lines"
path = "src/bin/client_lines.rs"

[[bin]]
name = "cluster_sim"
path = "src/bin/cluster_sim.rs"
