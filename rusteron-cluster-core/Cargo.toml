[package]
name = "rusteron-cluster-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nremond/rusteron"
readme = "README.md"
description = "Aeron Cluster's clustered service container as a sans-IO state machine, wire-compatible with Aeron 1.53.3: no clock, no randomness, no I/O."
keywords = ["aeron", "aeron-cluster", "consensus", "sans-io"]
categories = ["network-programming"]

[features]
# A fake consensus module and a log writer, for tests of services built on the container.
testkit = []

[dependencies]
rusteron-cluster-codecs = { path = "../rusteron-cluster-codecs", version = "0.1.0" }

[dev-dependencies]
proptest = { workspace = true }
rusteron-cluster-core = { path = ".", features = ["testkit"] }
