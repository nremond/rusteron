[package]
name = "rusteron-cluster"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nremond/rusteron"
readme = "README.md"
description = "Aeron Cluster in Rust on Aeron's C client: the consensus module, the clustered service container, the client and the backup, as Aeron's io.aeron.cluster lays them out, wire- and on-disk-compatible with Aeron 1.54.2."
keywords = ["aeron", "aeron-cluster", "consensus", "low-latency"]
categories = ["network-programming"]

[features]
default = ["build-from-source"]
# Aeron's C client, and the shells on it: the consensus module's, the backup's, the container's and the
# client's, the counters and mark files on the driver, ClusterTool and the binaries. Without it only the
# sans-IO state machines, the files' formats and the codecs build, and no C is compiled.
c-client = ["rusteron-archive/c-client", "dep:ctrlc", "dep:libc"]
# Builds Aeron C from source, as rusteron-archive's own feature.
build-from-source = ["c-client", "rusteron-archive/build-from-source"]
# Uses Aeron C precompiled, as rusteron-archive's own feature.
precompile = ["c-client", "rusteron-archive/precompile"]
# Links Aeron C statically, as rusteron-archive's own feature.
static = ["build-from-source", "rusteron-archive/static"]
# Fakes of a consensus module's and a service's surroundings, for tests.
testkit = ["rusteron-archive/testkit"]

[dependencies]
ctrlc = { workspace = true, features = ["termination"], optional = true }
libc = { version = "0.2", optional = true }
log = { workspace = true }
rusteron-archive = { path = "../rusteron-archive", version = "0.3.2", default-features = false }

[dev-dependencies]
proptest = { workspace = true }
rusteron-cluster = { path = ".", default-features = false, features = ["testkit"] }

[[bin]]
name = "consensus_module"
path = "src/bin/consensus_module.rs"
required-features = ["c-client"]

[[bin]]
name = "cluster_backup"
path = "src/bin/cluster_backup.rs"
required-features = ["c-client"]

[[bin]]
name = "cluster_tool"
path = "src/bin/cluster_tool.rs"
required-features = ["c-client"]
